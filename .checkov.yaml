# checkov configuration for the synthesized CloudFormation templates (cdk.out).
# Every skip carries the reason; anything not listed here fails the "Security / iac" job.
framework:
  - cloudformation
quiet: true
compact: true
skip-check:
  # Flagged on the dev permissions boundary (an upper bound, not a grant: the allow set is the service
  # allowlist and the denies carve out everything else); see src/infra/guard-stack.ts.
  - CKV_AWS_111
  - CKV_AWS_109
  # Bundle bucket (src/infra/extension-stack.ts): bundles are rebuilt from this repository on every deploy, so
  # versioning adds nothing; they are read only through the wiki's CloudFront distribution, whose logs cover
  # every read.
  - CKV_AWS_21
  - CKV_AWS_18
  # CDK-managed custom resources (BucketDeployment, autoDeleteObjects): deploy-time only, invoked by
  # CloudFormation (no async invocations to dead-letter, no concurrency to cap, nothing private to reach in a
  # VPC, no secrets in their environment).
  - CKV_AWS_115
  - CKV_AWS_116
  - CKV_AWS_117
  - CKV_AWS_173
  # Log groups use the CloudWatch Logs default encryption (AWS-owned keys), as in MCPWiki: no secrets or message
  # text are logged, and a customer-managed key adds cost without a sharing need.
  - CKV_AWS_158
  # The state table only holds 30-second tickets and live connections (src/infra/extension-stack.ts): nothing
  # to recover from a backup.
  - CKV_AWS_165
  # WebSocket access logging needs the account-wide API Gateway CloudWatch role, which this stack does not own;
  # the route function logs connect / disconnect instead. The HTTP ticket API has access logs.
  - CKV_AWS_95
  # The room queues are encrypted with SQS-managed keys (SqsManagedSseEnabled: true, checked in
  # test/extension.test.ts); this checkov version only accepts a KMS key (KmsMasterKeyId), which would add key
  # calls and permissions without a sharing need.
  - CKV_AWS_27
