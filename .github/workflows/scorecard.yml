name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'

permissions: read-all

jobs:
  analysis:
    # Scorecard targets public repositories (results publishing + code scanning upload).
    if: vars.CODE_SCANNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write # only used to publish results for public repositories
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ !github.event.repository.private && github.event_name != 'schedule' }}
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard.sarif
          category: scorecard
