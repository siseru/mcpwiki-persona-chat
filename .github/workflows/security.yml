name: Security

# Continuous security review: every PR, every push to main, and weekly (catches newly published CVEs).
# GitHub code scanning (SARIF upload) and Dependency Review need a public repository or a paid
# GitHub Code Security plan. Set the repository variable CODE_SCANNING_ENABLED=true when available;
# otherwise every scanner still runs and fails the job on findings, and reports are kept as artifacts.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --exit-code 1 --report-format sarif --report-path /repo/gitleaks.sarif
      - if: always() && vars.CODE_SCANNING_ENABLED == 'true'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - if: always() && !(vars.CODE_SCANNING_ENABLED == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  osv:
    name: Known vulnerable / malicious packages (OSV-Scanner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # OSV includes the OpenSSF malicious-packages feed (MAL-* advisories); the weekly schedule re-checks
      # already-merged lockfiles as new advisories are published.
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=package-lock.json

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request' && vars.CODE_SCANNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  iac:
    name: IaC scan (cdk-nag + checkov on synthesized templates)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Synthesize (with an example model list so every statement is scanned)
        run: npm run build && npx cdk synth --quiet -c devBedrockModels='["anthropic.claude-haiku-example"]'
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: us-west-2
          PERSONACHAT_WIKI: '{"dev":{"distributionArn":"arn:aws:cloudfront::123456789012:distribution/E1EXAMPLE12345"}}'
      - name: checkov
        run: |
          pipx run --spec 'checkov==3.3.25' checkov --config-file .checkov.yaml -d cdk.out \
            --output cli --output sarif --output-file-path console,checkov.sarif
      - if: always() && vars.CODE_SCANNING_ENABLED == 'true'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: checkov.sarif
          category: checkov
      - if: always() && !(vars.CODE_SCANNING_ENABLED == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkov-sarif
          path: checkov.sarif
          if-no-files-found: ignore

  workflows:
    name: GitHub Actions audit (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        run: pipx run 'zizmor==1.30.1' --format sarif .github/workflows > zizmor.sarif
      - if: always() && vars.CODE_SCANNING_ENABLED == 'true'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      - if: always() && !(vars.CODE_SCANNING_ENABLED == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zizmor-sarif
          path: zizmor.sarif
          if-no-files-found: ignore
      - name: zizmor (fail on findings)
        run: pipx run 'zizmor==1.30.1' --min-severity medium .github/workflows

  ai-review:
    name: AI security review (Claude)
    # Opt-in: set repository variable ENABLE_AI_SECURITY_REVIEW=true and secret ANTHROPIC_API_KEY.
    # Never runs for forks (no secrets) and only reads the PR diff.
    if: github.event_name == 'pull_request' && vars.ENABLE_AI_SECURITY_REVIEW == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main (2026-10)
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
